[package]
name = "pressure-e3-stage1"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "=0.2.191"
prost = "=0.14.1"
tonic = "=0.14.2"
tonic-prost = "=0.14.2"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
tokio-stream = { version = "=0.1.17", features = ["net"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[build-dependencies]
protoc-bin-vendored = "=3.2.0"
tonic-prost-build = "=0.14.2"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["test-util"] }
